[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibemark"
version = "0.1.0"
description = "Marketing automation CLI for vibe-coded projects"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "anthropic>=0.40.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "sse-starlette>=2.0.0",
]

[project.scripts]
vibemark = "vibemark.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vibemark"]
